
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム友達チャット</title>

    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>

    <div class="chat-container">

        <!-- ヘッダー -->
        <header class="chat-header">
            <h1>Apex Legends チャット</h1>
            <p>オンライン</p>
        </header>

        <!-- 会話エリア -->
        <main class="chat-area">

            <!-- 相手のメッセージ -->
            <div class="message-left">
                <div class="bubble">
                    <p>おはよう！今日Apexやる？</p>
                </div>
            </div>

            <!-- 自分のメッセージ -->
            <div class="message-right">
                <div class="bubble">
                    <p>やろう！何時からできる？</p>
                </div>
            </div>

            <!-- 相手のメッセージ -->
            <div class="message-left">
                <div class="bubble">
                    <p>20時くらいからなら大丈夫！</p>
                </div>
            </div>

            <!-- 自分のメッセージ -->
            <div class="message-right">
                <div class="bubble">
                    <p>了解！今日はランク行こう！</p>
                </div>
            </div>

            <!-- 相手のメッセージ（長い文章） -->
            <div class="message-left">
                <div class="bubble">
                    <p>いいね！最近ランクでなかなかポイントが盛れないから、今日は連携を意識して頑張ろう！キャラクターは何を使う予定？</p>
                </div>
            </div>

            <!-- 自分のメッセージ -->
            <div class="message-right">
                <div class="bubble">
                    <p>今日はレイスを使おうと思ってる！</p>
                </div>
            </div>

        </main>

        <!-- 入力エリア -->
        <footer class="chat-input">
            <input type="text" placeholder="メッセージを入力...">
            <button type="button">送信</button>
        </footer>

    </div>

</body>
</html>
